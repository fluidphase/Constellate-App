<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constellate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg0:#17181c;--bg1:#1e2025;--bg2:#26282e;--ln:#33363d;--tx:#eceef2;--mu:#9a9ea9;--th:#34373f;--ac:#3a5bff;--m:radial-gradient(farthest-side,#0000 calc(100% - 4px),#000 calc(100% - 3px));color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg0:#e3e5eb;--bg1:#f2f3f6;--bg2:#fff;--ln:#d9dce3;--tx:#1b1d22;--mu:#6a6e79;--th:#eceef3;color-scheme:light}
*{box-sizing:border-box}html{background:var(--bg0)}html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--tx);font:15px/1.4 Figtree,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit}button{color:inherit;background:none;border:0;cursor:pointer}[hidden]{display:none!important}
.lgl{display:none}[data-theme=light] .lgl{display:block}[data-theme=light] .lgd{display:none}
#auth{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg0);z-index:6;padding:16px}
.card{width:min(360px,100%);background:var(--bg1);border:1px solid var(--ln);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:10px}
.card .lg{width:64px;height:64px;margin:0 auto}.card h1{margin:0 0 6px;text-align:center;font-size:24px;font-weight:800}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin-bottom:6px}.tabs button{flex:1;padding:8px;color:var(--mu);font-weight:600;border-bottom:2px solid transparent}.tabs .on{color:var(--tx);border-color:var(--ac)}
input:not([type=range]):not([type=color]){padding:10px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg0);color:var(--tx);outline:none;width:100%}input:focus{border-color:var(--ac)}
.er{color:#ff6b6b;margin:0;min-height:1em;font-size:13px}.nf{margin:0;font-size:13px;color:var(--mu)}
.pb{background:var(--ac);color:#fff;padding:10px;border-radius:8px;font-weight:700}
#app{display:flex;height:100%}
.list{width:300px;background:var(--bg1);border-right:1px solid var(--ln);display:flex;flex-direction:column;flex:none}
.lh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln);font-weight:800;font-size:18px}.lh img{width:30px;height:30px}
.ib{width:32px;height:32px;border-radius:8px;font-size:18px;color:var(--mu);margin-left:auto}.ib:hover{background:var(--bg2);color:var(--tx)}
#cl{flex:1;overflow-y:auto;padding:8px}.em{color:var(--mu);text-align:center;padding:24px 12px}
.ci{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}.ci:hover,.ci.on{background:var(--bg2)}
.ci div{flex:1;min-width:0}.ci b{display:block;font-weight:600}.ci small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--bg0);border-top:1px solid var(--ln);cursor:pointer}.up div{flex:1;min-width:0;line-height:1.2}.up small{color:var(--mu);display:block}
.avw{position:relative;display:inline-block;flex:none;line-height:0}.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#111;overflow:hidden;line-height:1}.av img{width:100%;height:100%;object-fit:cover}
.fr{position:absolute;inset:-5px;border-radius:50%;pointer-events:none;-webkit-mask:var(--m);mask:var(--m)}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg2)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--ln);font-weight:700}header small{display:block;color:var(--mu);font-weight:400;font-size:12px}#bk{display:none;font-size:26px;padding:0 6px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:3px}
.row{display:flex;gap:8px;align-items:flex-end;transition:transform .15s;margin-top:2px}.row.me{flex-direction:row-reverse}.row .av{width:30px;height:30px;font-size:13px}
.w{display:flex;flex-direction:column;max-width:min(75%,480px)}.me .w{align-items:flex-end}
.nm{font-size:12px;font-weight:700;margin:6px 8px 2px}
.b{position:relative;padding:8px 12px;border-radius:18px;background:var(--th);white-space:pre-wrap;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none}
.them .b{border-bottom-left-radius:5px}.me .b{background:var(--ac);color:#fff;border-bottom-right-radius:5px}
.ce{width:22px;height:22px;vertical-align:-5px}.jumbo{background:none!important;padding:0}.jumbo .ce{width:52px;height:52px}
.qt{border-left:3px solid currentColor;padding:2px 8px;margin-bottom:5px;font-size:12px;opacity:.8}.qt b{display:block}.qt .ce{width:14px;height:14px}
.rx{display:flex;gap:4px;margin:-5px 8px 0;flex-wrap:wrap;z-index:1}
.chip{background:var(--bg1);border:1px solid var(--ln);border-radius:10px;padding:0 7px;font-size:12px;cursor:pointer}.chip .ce{width:15px;height:15px;vertical-align:-3px}.chip.me{border-color:var(--ac)}
.tm{font-size:10.5px;color:var(--mu);margin:2px 8px}
.hp{position:fixed;font-size:26px;animation:up .7s forwards;pointer-events:none;z-index:9}@keyframes up{to{transform:translateY(-30px) scale(1.5);opacity:0}}
#rp{display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--bg1);border-left:3px solid var(--ac);font-size:13px;color:var(--mu)}#rp span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ac{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;background:var(--bg1)}#ac button{background:var(--bg2);border-radius:6px;padding:4px 10px;white-space:nowrap}
#pk{background:var(--bg1);border-top:1px solid var(--ln);padding:8px 12px;max-height:230px;overflow-y:auto}#pk h4,.sh h4{margin:8px 0 4px;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.g{display:flex;flex-wrap:wrap;gap:4px}.g button{width:40px;height:40px;border-radius:8px;font-size:24px;display:grid;place-items:center}.g button:hover{background:var(--bg2)}.g .ce{width:30px;height:30px}
footer{display:flex;gap:8px;align-items:center;padding:10px 14px}footer input{flex:1;min-width:0;border-radius:10px;background:var(--bg1)}
footer button{width:40px;height:40px;border-radius:10px;font-size:20px;flex:none}#sd{background:var(--ac);color:#fff}
#ab{position:fixed;z-index:7;display:flex;gap:2px;align-items:center;max-width:92vw;overflow-x:auto;background:var(--bg1);border:1px solid var(--ln);border-radius:10px;padding:6px 8px;box-shadow:0 6px 24px #0006}#ab button{font-size:22px;padding:2px 5px;flex:none}#ab .ce{width:26px;height:26px}
.ov{position:fixed;inset:0;background:#0009;z-index:8;display:flex;align-items:center;justify-content:center}
.sh{background:var(--bg1);border:1px solid var(--ln);width:min(460px,100%);max-height:88%;overflow-y:auto;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sh h3{display:flex;justify-content:space-between;align-items:center;margin:0}.sh label{display:flex;justify-content:space-between;align-items:center;gap:10px}.sh label input:not([type=color]){width:60%}
.pr{display:flex;gap:14px;align-items:center}.pr .av{width:64px;height:64px;font-size:26px}.sws{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;color:var(--tx)}.sw.on,.bt.on{outline:2px solid var(--ac);outline-offset:1px}.bt{background:var(--bg2);padding:6px 12px;border-radius:8px}
.pic{display:block;max-width:100%;max-height:300px;border-radius:14px;cursor:zoom-in}.b.im{padding:4px}.b.im .cap{padding:4px 8px 2px}#lb img{max-width:95vw;max-height:90vh;border-radius:8px}#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bg1);border:1px solid var(--ln);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10}#toast.on{opacity:1}
@media(max-width:700px){.list{width:100%}.chat{position:fixed;inset:0;transform:translateX(100%);transition:transform .25s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body.chatting .chat{transform:none}#bk{display:block}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<div class="tabs"><button id="ti" class="on">Log in</button><button id="tu">Sign up</button></div>
